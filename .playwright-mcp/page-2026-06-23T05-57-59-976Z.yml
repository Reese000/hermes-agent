            - generic [ref=e546]:
              - text: Each denied action shows a notification and appears in
              - code [ref=e547]: /permissions
              - text: under the Recently denied tab, where you can press
              - code [ref=e548]: r
              - text: to retry it with a manual approval.
            - generic [ref=e549]: If the classifier blocks an action 3 times in a row or 20 times total, auto mode pauses and Claude Code resumes prompting. Approving the prompted action resumes auto mode. These thresholds are not configurable. Any allowed action resets the consecutive counter, while the total counter persists for the session and resets only when its own limit triggers a fallback.
            - generic [ref=e550]:
