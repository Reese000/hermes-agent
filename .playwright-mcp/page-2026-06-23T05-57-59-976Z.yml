              - generic [ref=e535] [cursor=pointer]: Boundaries you state in conversation
            - generic [ref=e536]: The classifier treats boundaries you state in the conversation as a block signal. If you tell Claude “don’t push” or “wait until I review before deploying”, the classifier blocks matching actions even when the default rules would allow them. A boundary stays in force until you lift it in a later message. Claude’s own judgment that a condition was met does not lift it.
            - generic [ref=e537]:
              - text: Boundaries are not stored as rules. The classifier re-reads them from the transcript on each check, so a boundary can be lost if
              - link "context compaction" [ref=e538] [cursor=pointer]:
                - /url: /docs/en/costs#reduce-token-usage
              - text: removes the message that stated it. For a hard guarantee, add a
              - link "deny rule" [ref=e539] [cursor=pointer]:
                - /url: /docs/en/permissions#permission-rule-syntax
              - text: instead.
