              - generic [ref=e389]: Auto mode requires Claude Code v2.1.83 or later.
            - generic [ref=e390]:
              - text: Auto mode lets Claude execute without routine permission prompts. A separate classifier model reviews actions before they run, blocking anything that escalates beyond your request, targets unrecognized infrastructure, or appears driven by hostile content Claude read. Explicit
              - link "ask rules" [ref=e391] [cursor=pointer]:
                - /url: /docs/en/permissions#manage-permissions
              - text: still force a prompt.
            - generic [ref=e392]:
              - text: Auto mode also nudges Claude to keep working without stopping for clarifying questions, though Claude still asks when your prompt or a skill explicitly relies on it. For stronger autonomous behavior while keeping permission prompts, set the
              - link "Proactive output style" [ref=e393] [cursor=pointer]:
                - /url: /docs/en/output-styles
              - text: instead.
            - generic [ref=e394]:
              - img "Warning" [ref=e396]
              - generic [ref=e399]: Auto mode is a research preview. It reduces prompts but does not guarantee safety. Use it for tasks where you trust the general direction, not as a replacement for review on sensitive operations.
